<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH Transaction DApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">ETH Transaction DApp</h1>
        
        <!-- Connection Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Wallet Connection</h5>
            </div>
            <div class="card-body">
                <button id="connectButton" class="btn btn-primary">Connect MetaMask</button>
                <div id="accountInfo" class="mt-2"></div>
                <div id="networkInfo" class="mt-2"></div>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Account Balances</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Your Balance</h6>
                        <p id="userBalance">-</p>
                    </div>
                    <div class="col-md-6">
                        <h6>Contract Balance</h6>
                        <p id="contractBalance">-</p>
                    </div>
                </div>
                <button id="refreshBalance" class="btn btn-outline-secondary btn-sm">Refresh Balances</button>
            </div>
        </div>

        <!-- Transaction Section -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Send ETH</h5>
            </div>
            <div class="card-body">
                <form id="transactionForm">
                    <div class="mb-3">
                        <label for="recipient" class="form-label">Recipient Address</label>
                        <input type="text" class="form-control" id="recipient" placeholder="0x...">
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (ETH)</label>
                        <input type="number" class="form-control" id="amount" step="0.001" placeholder="0.1">
                    </div>
                    <button type="submit" class="btn btn-success" id="sendButton">Send ETH</button>
                </form>
                <div id="transactionStatus" class="mt-3"></div>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="card">
            <div class="card-header">
                <h5>Transaction History</h5>
            </div>
            <div class="card-body">
                <button id="loadHistory" class="btn btn-outline-primary mb-3">Load History</button>
                <div id="transactionHistory"></div>
            </div>
        </div>
    </div>

    <!-- Web3 and JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@truffle/contract@latest/dist/truffle-contract.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
